#
# Pull request and main CI. The jobs (Arch, Lint) are the shared C++ CI of the
# workspace repository (.github/workflows/cpp-ci.yml), which says what each one
# does. This file passes only what differs here. There is no flake, so the Nix
# jobs are off. The FreeBSD packages are built by hand with
# dist/freebsd/build.sh, which runs only on FreeBSD.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: phosphor-works/workspace/.github/workflows/cpp-ci.yml@v4
    with:
      pin-file: cmake/BotsDependencies.cmake
      # Run in the suite CI images of the packaging repository.
      ci-images: true
      nix: false

  # Both bots ship as FreeBSD packages, built with clang and libc++ (no float
  # std::from_chars there). dist/freebsd/build.sh builds, runs the tests and
  # makes the packages, in a FreeBSD VM.
  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build, test and package on FreeBSD 15.1
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          prepare: pkg install -y cmake-core ninja pkgconf curl googletest nlohmann-json
          run: |
            set -eu
            sh dist/freebsd/build.sh "$PWD/packages"
            ls -l packages
